name: Windows 验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows x64 完整门禁
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装固定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: 安装固定 pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: 安装固定 Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1

      - name: 安装冻结依赖
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: 运行源码门禁
        shell: pwsh
        run: |
          pnpm run check
          pnpm audit --prod --audit-level high
          cargo test --locked --manifest-path native/launcher/Cargo.toml

      - name: 暂存并验证真实运行时
        shell: pwsh
        run: |
          pnpm run stage:runtime
          pnpm run smoke:launcher
          pnpm run smoke:native
          pnpm run smoke:runtime

      - name: 构建并审计未签名应用目录
        shell: pwsh
        run: |
          pnpm run stage:app
          pnpm exec tsx scripts/package-win.ts
          pnpm run audit:package
          pnpm run smoke:packaged

      - name: 验证内部安装与卸载
        shell: pwsh
        run: |
          pnpm run make:installer
          pnpm run audit:installer
          pnpm run smoke:installer
