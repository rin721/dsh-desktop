<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
    <title>DSH Desktop 启动失败</title>
    <link rel="stylesheet" href="desktop.css">
    <script src="failure.js" defer></script>
  </head>
  <body>
    <main class="shell failure" aria-live="assertive">
      <img class="brand-icon" src="icons/png/app-icon-192.png" alt="">
      <p class="eyebrow">启动检查已停止</p>
      <h1>未能启动 Harness</h1>
      <p id="message" class="message">桌面运行时校验或初始化失败。</p>
      <p class="hint">可以从“文件 → 打开日志目录”查看已经脱敏的诊断。关闭窗口后重新启动应用即可重试。</p>
      <code id="code">desktop-initialization-failed</code>
      <div class="actions">
        <button id="retry" type="button">重新启动</button>
        <button id="exit" type="button" class="secondary">退出</button>
      </div>
    </main>
  </body>
</html>
